[build-system]
requires = ["setuptools>=68", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgroebner-pytorch-cocoa"
version = "0.1.0"
description = "Public DeepGroebner-PyTorch release including a PPO training script and various neural network architectures in PyTorch and an environment that runs Buchberger's algorithm using CoCoALib in C++ ."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "gymnasium>=1.1",
  "numpy",
  "torch",
  "tyro>=0.8",
]

[project.optional-dependencies]
tracking = [
  "wandb>=0.17",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
deepgroebner-pytorch-cocoa-verify = "deepgroebner_pytorch_cocoa.verify_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepgroebner_pytorch_cocoa = [
  "*.pyx", "*.pxd", "*.h", "*.cpp",
  "data/LamanGraphs3-10/LamanGraphs[3-9].txt",
  "data/LamanGraphs3-10/LamanGraphs10.txt",
]
