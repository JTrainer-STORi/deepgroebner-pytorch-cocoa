name: Install Verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-custom-cocoalib-path:
    name: Install with custom CoCoALib path (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libgmp-dev make

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gmp

      - name: Build CoCoALib on Linux
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/cocoa-official/CoCoALib.git /tmp/CoCoALib
          cd /tmp/CoCoALib
          ./configure --only-cocoalib
          make library

      - name: Build CoCoALib on macOS
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 https://github.com/cocoa-official/CoCoALib.git /tmp/CoCoALib
          cd /tmp/CoCoALib
          ./configure --only-cocoalib --with-libgmp="$(brew --prefix gmp)/lib/libgmp.dylib"
          make library

      - name: Install Python package against custom CoCoALib path
        env:
          COCOA_INCLUDE_DIR: /tmp/CoCoALib/include
          COCOA_LIB_DIR: /tmp/CoCoALib/lib
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            export GMP_INCLUDE_DIR="$(brew --prefix gmp)/include"
            export GMP_LIB_DIR="$(brew --prefix gmp)/lib"
          fi
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run installation smoke tests
        run: |
          deepgroebner-pytorch-cocoa-verify
          pytest tests/test_runner.py

  install-standard-system-location:
    name: Install with standard /usr/local CoCoALib layout (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libgmp-dev make rsync

      - name: Build CoCoALib
        run: |
          git clone --depth 1 https://github.com/cocoa-official/CoCoALib.git /tmp/CoCoALib
          cd /tmp/CoCoALib
          ./configure --only-cocoalib
          make library

      - name: Install CoCoALib into standard system locations
        run: |
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo rsync -a /tmp/CoCoALib/include/CoCoA /usr/local/include/
          sudo install -m 644 /tmp/CoCoALib/lib/libcocoa.a /usr/local/lib/libcocoa.a
          sudo ldconfig

      - name: Install Python package using auto-discovered CoCoALib
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run installation smoke tests
        run: |
          deepgroebner-pytorch-cocoa-verify
          pytest tests/test_runner.py
